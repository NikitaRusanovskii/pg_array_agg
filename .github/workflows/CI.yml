name: CI

on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 20
            os: ubuntu-26.04
          - postgres: 19
            os: ubuntu-26.04-arm
          - postgres: 18
            os: ubuntu-24.04
          - postgres: 17
            os: ubuntu-24.04-arm
          - postgres: 16
            os: ubuntu-22.04
          - postgres: 15
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}
          dev-files: true

      - run: make USE_PGXS=1
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -fsanitize=undefined -Wno-unused-parameter -Wno-sign-compare ${{ matrix.postgres == 18 && '-Wno-missing-field-initializers' || '' }}

      - run: |
          export PG_CONFIG=`which pg_config`
          sudo --preserve-env=PG_CONFIG make install USE_PGXS=1

      - run: |
          sudo apt-get update
          sudo apt-get install libipc-run-perl

      - run: |
          make installcheck USE_PGXS=1

      - if: ${{ failure() }}
        run: cat test/regression.diffs

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install cppcheck

      - name: checking
        run: |
          cppcheck \
            --enable=all \
            --inconclusive \
            --force \
            --inline-suppr \
            --error-exitcode=1 \
            --suppress=missingInclude \
            --language=c \
            --std=c11 \
            --template=gcc \
            --file-filter='*.c' \
            --file-filter='*.h' \
            --check-level=exhaustive \
            src/

  valgrind:
    name: Valgrind + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PostgreSQL with Valgrind
        uses: ankane/setup-postgres-valgrind@v1
        with:
          postgres-version: 18
          check-ub: yes
          track-origins: yes

      - name: Build extension
        run: |
          export PG_CONFIG=$(which pg_config)
          make USE_PGXS=1 OPTFLAGS="" \
            PG_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=all" \
            PG_LDFLAGS="-fsanitize=undefined"

      - name: Install extension
        run: |
          export PG_CONFIG=$(which pg_config)
          sudo --preserve-env=PG_CONFIG make install USE_PGXS=1

      - name: Regression tests — arithmetic
        run: |
          make installcheck USE_PGXS=1 REGRESS=agg_arith TAP_TESTS=0

      - name: Regression tests — min/max
        run: |
          make installcheck USE_PGXS=1 REGRESS=agg_minmax TAP_TESTS=0

      - name: Regression tests — count
        run: |
          make installcheck USE_PGXS=1 REGRESS=agg_count TAP_TESTS=0

      - name: Regression tests — count_if
        run: |
          make installcheck USE_PGXS=1 REGRESS=agg_count_if TAP_TESTS=0

      - name: Regression tests — all/any/none
        run: |
          make installcheck USE_PGXS=1 REGRESS=agg_allanynone TAP_TESTS=0

      - name: Show regression diffs
        if: failure()
        run: |
          if [ -f test/regression.diffs ]; then
            cat test/regression.diffs
          fi

      - name: List diagnostic logs
        if: always()
        run: |
          find /tmp/pg-valgrind -maxdepth 1 -type f -print || true
      - name: Fix diagnostic log permissions
        if: always()
        run: |
          sudo chmod -R a+rX /tmp/pg-valgrind || true

      - name: Upload Valgrind and UBSan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs-postgres-18
          path: /tmp/pg-valgrind/
          if-no-files-found: warn
          retention-days: 14
