name: CI
on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 20
            os: ubuntu-26.04
          - postgres: 19
            os: ubuntu-26.04-arm
          - postgres: 18
            os: ubuntu-24.04
          - postgres: 17
            os: ubuntu-24.04-arm
          - postgres: 16
            os: ubuntu-22.04
          - postgres: 15
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: ${{ matrix.postgres }}
          dev-files: true
      - run: make USE_PGXS=1
        env:
          PG_CFLAGS: -DUSE_ASSERT_CHECKING -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare ${{ matrix.postgres == 18 && '-Wno-missing-field-initializers' || '' }}
      - run: |
          export PG_CONFIG=`which pg_config`
          sudo --preserve-env=PG_CONFIG make install USE_PGXS=1
      - run: |
          sudo apt-get update
          sudo apt-get install libipc-run-perl
      - run: make installcheck USE_PGXS=1
      - if: ${{ failure() }}
        run: cat regression.diffs
  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install cppcheck
        
      - name: checking
        run: |
          cppcheck \
            --enable=all \
            --inconclusive \
            --force \
            --inline-suppr \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            --language=c \
            --std=c11 \
            --template=gcc \
            --file-filter='*.c' \
            --file-filter='*.h' \
            --check-level=exhaustive \
            src/